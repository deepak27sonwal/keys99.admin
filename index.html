<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Keys99 Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app-shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">K</div><div><strong>Keys99</strong><span>Admin Panel</span></div></div>
  <nav id="sidebar-nav">
    <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
    <button class="nav-item" data-page="projects">▣ <span>Residential Projects</span></button>
    <button class="nav-item" data-page="developers">◆ <span>Developers</span></button>
    <button class="nav-item" data-page="locations">⌖ <span>Locations</span></button>
    <button class="nav-item" data-page="agents">◉ <span>Agents</span></button>
    <button class="nav-item" data-page="enquiries">✉ <span>Enquiries</span></button>
    <button class="nav-item" data-page="moderation">✓ <span>Moderation</span></button>
    <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
  </nav>
  <div class="sidebar-foot"><span id="role-badge">ADMIN</span><button id="logout-btn">Sign out</button></div>
</aside>
<main class="main">
  <header class="topbar"><button id="mobile-menu" class="icon-btn">☰</button><div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Keys99 residential platform overview</p></div><div class="top-actions"><span id="user-name"></span></div></header>
  <section id="content" class="content"></section>
</main>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
