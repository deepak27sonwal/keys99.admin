<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#046b5e">
<title>Unsubscribe · Keys99</title>
<!--
  Opened from the "Unsubscribe" link at the bottom of every Keys99 newsletter
  (unsubscribe.html?t=<token>). Asks for a click before unsubscribing, so email link
  scanners that open links can't unsubscribe anyone by accident. Talks to the public
  newsletter-unsubscribe Supabase function; no login needed.
-->
<style>
  :root{--green:#046b5e;--ink:#0a2f2c;--soft:#3d5a58;--line:#e6edec;--bg:#f5f9f8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;max-width:440px;width:100%;padding:32px 26px;text-align:center;box-shadow:0 10px 30px rgba(2,20,18,.06)}
  img{width:150px;height:auto;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:var(--soft);line-height:1.6;margin:0 0 20px;overflow-wrap:anywhere}
  button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  a{color:var(--green)}
</style>
</head>
<body>
<div class="card">
  <img src="./assets/images/logo.png" alt="Keys99.com">
  <h1 id="title">Loading…</h1>
  <p id="msg"></p>
  <button id="btn" type="button" hidden>Unsubscribe</button>
</div>
<script>
  (function () {
    var FN = 'https://ljyywdgwjiedeiuqchdt.supabase.co/functions/v1/newsletter-unsubscribe';
    var token = new URLSearchParams(location.search).get('t') || '';
    var title = document.getElementById('title'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
    function show(t, m) { title.textContent = t; msg.innerHTML = m; }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function call(method) {
      return fetch(FN + '?t=' + encodeURIComponent(token), { method: method })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); });
    }
    if (!token) { show('Link not valid', 'This unsubscribe link is incomplete. Please use the link from the latest Keys99 email.'); return; }
    if (token === 'test') { show('This is a test email', 'Unsubscribe links work in the real newsletter — nothing was changed.'); return; }
    call('GET').then(function (s) {
      if (!s.is_subscribed) { show('Already unsubscribed', '<b>' + esc(s.email) + '</b> isn’t receiving Keys99 newsletters.'); return; }
      show('Unsubscribe from Keys99?', 'Stop sending newsletters to <b>' + esc(s.email) + '</b>.');
      btn.hidden = false;
      btn.onclick = function () {
        btn.disabled = true; btn.textContent = 'Unsubscribing…';
        call('POST').then(function (r) {
          btn.hidden = true;
          show('You’re unsubscribed', '<b>' + esc(r.email) + '</b> won’t receive Keys99 newsletters any more. Changed your mind? Subscribe again any time on <a href="https://keys99.com">keys99.com</a>.');
        }).catch(function (e) { btn.disabled = false; btn.textContent = 'Try again'; msg.textContent = e.message; });
      };
    }).catch(function (e) { show('Something went wrong', esc(e.message)); });
  })();
</script>
</body>
</html>
